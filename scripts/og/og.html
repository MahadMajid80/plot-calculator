<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Plus Jakarta Sans',sans-serif;background:#f5f6fa;padding:28px}
.p{height:100%;border-radius:40px;background:#e9edf6;padding:64px 72px;display:flex;gap:48px;align-items:center}
.l{flex:1}
.e{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#535a74}
.e b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#3f5297;color:#fff;font-size:18px;letter-spacing:0}
h1{text-wrap:balance;margin-top:28px;font-size:64px;line-height:1.02;letter-spacing:-.04em;font-weight:800;color:#14172b}
h1 span{display:block;color:#3f5297}
.s{margin-top:26px;font-size:26px;color:#535a74;font-weight:500}
.c{width:360px;border-radius:32px;background:#161c37;color:#fff;padding:34px;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.2px);background-size:18px 18px}
.c small{font-size:19px;color:rgba(255,255,255,.7)}
.c .t{font-size:58px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.bar{display:flex;gap:8px;margin:22px 0}.bar i{height:12px;border-radius:9px}
.row{display:flex;justify-content:space-between;font-size:19px;padding:8px 0;border-top:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.row b{color:#fff}
.logo{display:flex;align-items:center;gap:12px;margin-top:34px;font-size:30px;font-weight:800;color:#14172b}
.logo img{width:46px;height:46px}.logo span{color:#3f5297}
</style></head><body><div class="p"><div class="l">
<div class="e"><b>PK</b>Construction cost 2026</div>
<h1>House construction cost in Pakistan,<span>item by item.</span></h1>
<p class="s">3 marla to 2 kanal · 12 cities · PKR, USD, GBP, AED</p>
<div class="logo"><img src="icon.svg"><em style="font-style:normal">Plot<span>.pk</span></em></div>
</div><div class="c"><small>10 marla, double storey</small><div class="t">Rs 2.79 Cr</div>
<div class="bar"><i style="width:62%;background:#b1bde6"></i><i style="width:38%;background:#d49a8c"></i></div>
<div class="row">Grey structure<b>Rs 1.39 Cr</b></div><div class="row">Tiles &amp; marble<b>✓</b></div><div class="row">Doors &amp; windows<b>✓</b></div><div class="row">ACs &amp; appliances<b>✓</b></div>
</div></div></body></html>
